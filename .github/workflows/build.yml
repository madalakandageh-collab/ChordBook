name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install Dependencies & Build Web
        run: |
          npm install --legacy-peer-deps
          npm run build
      - name: Add Android & Sync Capacitor
        run: |
          npx cap add android || true
          npx cap sync android
      - name: Add AdMob App ID to AndroidManifest
        run: |
          sed -i 's/<\/application>/    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"\/>\n    <\/application>/' android/app/src/main/AndroidManifest.xml
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chordbook-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
